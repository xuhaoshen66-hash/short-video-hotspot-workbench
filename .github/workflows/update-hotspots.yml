name: Update hotspots

on:
  workflow_dispatch:
  schedule:
    # Beijing time: 08:00, 11:00, 17:00, 20:00
    - cron: "0 0,3,9,12 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update hotspot data
        run: node scripts/update-hotspots.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.js update-meta.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update hotspot data"
            git push
          fi
