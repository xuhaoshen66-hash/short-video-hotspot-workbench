<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Howson的工作台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --ink: #152033;
        --muted: #64748b;
        --line: #d9e2ec;
        --accent: #0f8f9f;
        --accent-strong: #0b7280;
        --accent-soft: #e8f7fa;
        --shadow: 0 18px 50px rgba(21, 32, 51, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(15, 143, 159, 0.12), transparent 28%),
          linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      .portal-shell {
        min-height: 100vh;
        display: grid;
        align-content: center;
        gap: 28px;
        padding: 42px;
      }

      .portal-header {
        max-width: 960px;
        margin: 0 auto;
        width: 100%;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 54px);
        line-height: 1.06;
        letter-spacing: 0;
      }

      .lead {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.8;
        max-width: 720px;
      }

      .portal-grid {
        width: min(960px, 100%);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .portal-card {
        min-height: 260px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
        color: inherit;
        text-decoration: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .portal-card:hover {
        transform: translateY(-3px);
        border-color: rgba(15, 143, 159, 0.5);
        box-shadow: 0 22px 58px rgba(21, 32, 51, 0.14);
      }

      .card-kicker {
        margin: 0 0 12px;
        color: var(--accent-strong);
        font-size: 13px;
        font-weight: 700;
      }

      .portal-card h2 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      .portal-card p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .card-meta span {
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 13px;
        font-weight: 700;
      }

      .card-action {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        border-radius: 999px;
        padding: 10px 14px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .portal-shell {
          align-content: start;
          padding: 28px 18px;
        }

        .portal-grid {
          grid-template-columns: 1fr;
        }

        .portal-card {
          min-height: 230px;
        }
      }
    </style>
  </head>
  <body>
    <main class="portal-shell">
      <header class="portal-header">
        <p class="eyebrow">Howson Workspace</p>
        <h1>Howson的工作台</h1>
        <p class="lead">选择要进入的工具。热点选题工作台和金融口播素材库相互独立，数据与功能互不影响。</p>
      </header>

      <section class="portal-grid" aria-label="工具入口">
        <a class="portal-card" href="workbench.html">
          <div>
            <p class="card-kicker">短视频热点</p>
            <h2>热点选题工作台</h2>
            <p>查看热点榜、筛选选题、管理拍摄状态和资料包。</p>
          </div>
          <div class="card-meta">
            <span>热点榜单</span>
            <span>选题判断</span>
            <span>拍摄资料包</span>
          </div>
          <span class="card-action">进入工作台</span>
        </a>

        <a class="portal-card" href="finance-library.html">
          <div>
            <p class="card-kicker">金融科普</p>
            <h2>金融口播素材库 V2</h2>
            <p>浏览贷款、信用卡、防诈骗、投资骗局等口播文案，支持目录查找和复制使用。</p>
          </div>
          <div class="card-meta">
            <span>443条素材</span>
            <span>树状目录</span>
            <span>V2终版</span>
          </div>
          <span class="card-action">进入素材库</span>
        </a>
      </section>
    </main>
  </body>
</html>
